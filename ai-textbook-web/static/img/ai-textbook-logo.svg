<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e3f2fd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42a5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e88e5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Book with simple design -->
  <g transform="translate(10, 5)">
    <!-- Book cover -->
    <path d="M5 10 L5 45 L35 45 L35 15 L25 5 L5 5 Z" fill="url(#bookGradient)" opacity="0.9"/>

    <!-- Book spine -->
    <path d="M5 10 L25 10 L25 5 L5 5 Z" fill="url(#accentGradient)" opacity="0.8"/>

    <!-- Book pages -->
    <path d="M35 15 L40 10 L40 45 L35 45 Z" fill="url(#pageGradient)" opacity="0.9"/>

    <!-- Book opening curve -->
    <path d="M25 5 L35 15 L35 45 L25 45 Z" fill="#ffffff" opacity="0.7"/>

    <!-- Simple book lines/pages -->
    <g transform="translate(37, 15)">
      <line x1="0" y1="0" x2="2" y2="0" stroke="url(#bookGradient)" stroke-width="0.8" opacity="0.6"/>
      <line x1="0" y1="4" x2="2" y2="4" stroke="url(#bookGradient)" stroke-width="0.8" opacity="0.6"/>
      <line x1="0" y1="8" x2="2" y2="8" stroke="url(#bookGradient)" stroke-width="0.8" opacity="0.6"/>
      <line x1="0" y1="12" x2="2" y2="12" stroke="url(#bookGradient)" stroke-width="0.8" opacity="0.6"/>
      <line x1="0" y1="16" x2="2" y2="16" stroke="url(#bookGradient)" stroke-width="0.8" opacity="0.6"/>
      <line x1="0" y1="20" x2="2" y2="20" stroke="url(#bookGradient)" stroke-width="0.8" opacity="0.6"/>
    </g>

    <!-- Simple AI/tech accent -->
    <g transform="translate(15, 25)">
      <circle cx="0" cy="0" r="2" fill="url(#accentGradient)" opacity="0.7"/>
      <circle cx="0" cy="0" r="1" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>
</svg>